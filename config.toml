# Настройки терминального скринсейвера. Файл целиком необязателен:
# отсутствующие поля берутся из значений по умолчанию,
# а аргументы командной строки перекрывают и то, и другое.

# --- производительность ---------------------------------------------------

# Целевая частота кадров. 0 — считать без ограничения (греет процессор).
fps = 30
# Рабочие потоки. 0 — по числу ядер.
threads = 0
# Сглаживание N×N лучей на знакоместо: 1 — выключено, 2 — 2×2, до 4.
# Каждый шаг умножает объём вычислений на N².
supersample = 1
# Базовый бюджет итераций. Реальный растёт автоматически с глубиной зума.
max_iter = 220

# --- картинка -------------------------------------------------------------

# 24-битный цвет. Закомментировано — определять по окружению.
# truecolor = true

# Символы от «пусто» до «сплошь»: по ним раскладывается яркость.
char_ramp = " .,:;-+=*#%@█"
# Отношение высоты знакоместа к ширине. 2.0 подходит почти всем терминалам;
# уменьшите, если круги выглядят вытянутыми.
char_aspect = 2.0
# Во сколько раз сжать шкалу итераций перед выборкой цвета.
# Больше — цветные полосы уже и их больше.
color_cycle = 0.035
# Скорость «бега» палитры, циклов в секунду. 0 — статичные цвета.
palette_speed = 0.02

# --- поведение автопилота -------------------------------------------------

autopilot = true
hud = true
# Сколько стоять в точке и сколько лететь до следующей, в секундах.
scene_seconds = 8.0
flight_seconds = 7.0
# Медленное погружение и вращение во время стоянки.
drift_zoom = 0.045
drift_spin = 0.004
# Доля сцен, которые ищутся автоматически вместо cameras.json. 0 — только список.
discovery_ratio = 0.25

# --- файлы и экспорт ------------------------------------------------------

# Пустая строка — использовать наборы, вшитые в бинарник.
palettes_path = "assets/palettes.json"
cameras_path = "assets/cameras.json"

output_dir = "frames"
export_width = 1280
# Писать каждый кадр в PNG. Реальное время при этом теряется — режим для видео.
record = false
